# docker compose up --build  ->  http://localhost:3000
# Cần file .env (copy từ .env.example) với MSSQL_SA_PASSWORD và ADMIN_PASSWORD.
services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Dat MSSQL_SA_PASSWORD trong file .env}
    ports:
      - "1433:1433"
    volumes:
      - mssql-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      retries: 12
      start_period: 20s

  web:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      MSSQL_CONNECTION_STRING: Server=db,1433;Database=InklineStudio;User Id=sa;Password=${MSSQL_SA_PASSWORD};Encrypt=true;TrustServerCertificate=true
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      SITE_URL: ${SITE_URL:-http://localhost:3000}
    ports:
      - "3000:3000"

volumes:
  mssql-data:
